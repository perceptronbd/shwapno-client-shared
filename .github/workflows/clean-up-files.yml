name: Clean up files on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  clean_files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}

      - name: Remove specific files
        run: |
          rm -rf .storybook
          rm -f tsconfig.json
          rm -f README.md
          find src/components -name "*.stories.tsx" -type f -delete
          echo "Unwanted files removed."

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Remove unwanted files during PR"

      - name: Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push origin HEAD:${{ github.head_ref }}
